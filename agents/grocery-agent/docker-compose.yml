# docker compose up --build  →  UI http://localhost:5175 · API http://localhost:8788/docs
# Uses .env if present (copy .env.example). With no keys it runs on Mock store providers (sample data).
services:
  api:
    build: ./backend
    ports: ['8788:8788']
    env_file:
      - path: .env
        required: false
    environment:
      HOST: 0.0.0.0
      PORT: 8788
      DATA_FILE: /data/db.json
    volumes: ['grocery-data:/data']
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:8788/api/health']
      interval: 10s
      retries: 5
  web:
    build: ./frontend
    ports: ['5175:80']
    depends_on: [api]
  # Production: swap the in-memory cache/queue for Redis (see docs/ARCHITECTURE.md)
  # redis:
  #   image: redis:7-alpine
volumes:
  grocery-data:
