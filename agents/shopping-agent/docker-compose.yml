# docker compose up --build  →  UI http://localhost:5174 · API http://localhost:8787/docs
# Uses .env if present (copy .env.example). With no keys it runs on the Mock provider (sample data).
services:
  api:
    build:
      context: ../..
      dockerfile: docker/node-service.Dockerfile
      args: { WORKSPACE: '@akaya/shopping-agent-backend', DIR: agents/shopping-agent/backend }
    ports: ['8787:8787']
    env_file:
      - path: .env
        required: false
    environment:
      HOST: 0.0.0.0
      PORT: 8787
      DATA_FILE: /data/db.json
    volumes: ['shopping-data:/data']
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:8787/api/health']
      interval: 10s
      retries: 5
  web:
    build:
      context: ../..
      dockerfile: docker/vite-web.Dockerfile
      args: { WORKSPACE: '@akaya/shopping-agent-frontend', DIR: agents/shopping-agent/frontend }
    environment:
      API_UPSTREAM: http://api:8787
    ports: ['5174:80']
    depends_on: [api]
  # Production: swap the in-memory cache/queue for Redis (see docs/ARCHITECTURE.md)
  # redis:
  #   image: redis:7-alpine
volumes:
  shopping-data:
